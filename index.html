<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Playoff Bracket Pool</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 10px;
            font-size: 2.8em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5em;
            color: #1a1a2e;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button.secondary {
            background: #6c757d;
        }

        button.secondary:hover {
            background: #5a6268;
        }

        .success-message, .error-message {
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Leaderboard */
        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #d4edda;
            color: #155724;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #28a745;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .leaderboard-table th {
            background: #1a1a2e;
            color: white;
            padding: 15px;
            text-align: left;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .leaderboard-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        .leaderboard-table tr:hover {
            background: #f8f9fa;
        }

        .rank-1 {
            background: #fff3cd !important;
            font-weight: 600;
        }

        .rank-2 {
            background: #e2e3e5 !important;
        }

        .rank-3 {
            background: #f8d7da !important;
        }

        .bracket-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .bracket-link:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .admin-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .admin-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .admin-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NFL Playoff Bracket Pool</h1>
        <p class="subtitle">Track the competition and see who's winning!</p>

        <!-- Submit Bracket -->
        <div class="section">
            <h2 class="section-title">Make Your Picks</h2>
            <p style="color: #666;">
                Use the <strong><a href="bracket-picker.html" style="color: #667eea;">bracket picker</a></strong> to make your picks and submit directly!
            </p>
        </div>

        <!-- Leaderboard -->
        <div class="section">
            <div class="leaderboard-header">
                <h2 class="section-title" style="margin: 0;">Leaderboard</h2>
                <div class="live-badge">
                    <div class="live-dot"></div>
                    <span>Live Updates</span>
                </div>
            </div>
            <div id="leaderboard-container">
                <div class="empty-state">Loading...</div>
            </div>
        </div>

        <!-- Admin Link -->
        <div class="admin-link">
            <a href="admin.html">Admin Panel</a>
        </div>
    </div>

    <script>
        // ===== STATE =====
        let brackets = [];
        let results = {};
        let config = { afc: [], nfc: [] };
        let TEAM_NAMES = {};
        let teamSeeds = {};

        // ===== API FUNCTIONS =====

        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const data = await response.json();
                config = data.config || { afc: [], nfc: [] };
                buildTeamMappings();
            } catch (error) {
                console.error('Failed to load config:', error);
            }
        }

        async function loadData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                brackets = data.brackets || [];
                results = data.results || {};
                updateLeaderboard();
            } catch (error) {
                console.error('Failed to load data:', error);
            }
        }

        function buildTeamMappings() {
            // Build TEAM_NAMES and teamSeeds from config
            TEAM_NAMES = {};
            teamSeeds = {};

            config.afc.forEach((name, i) => {
                const key = getTeamKey(name);
                TEAM_NAMES[key] = name;
                teamSeeds[key] = i + 1;
            });

            config.nfc.forEach((name, i) => {
                const key = getTeamKey(name);
                TEAM_NAMES[key] = name;
                teamSeeds[key] = i + 1;
            });
        }

        function getTeamKey(teamName) {
            return teamName.toLowerCase().replace(/\s+/g, '').replace(/[^a-z0-9]/g, '');
        }

        function getTeamDisplay(key) {
            return TEAM_NAMES[key] || key;
        }

        // ===== SCORING ENGINE =====

        function calculateScore(picks) {
            let score = 0;
            let correct = [];
            let incorrect = [];

            // Point values by round
            const pointValues = {
                'wc_': 1,      // Wildcard games
                'div_': 2,     // Divisional games
                'conf_': 4,    // Conference championship games
                'superbowl': 8 // Super Bowl
            };

            for (let gameId in results) {
                if (gameId === 'sbActualTotal') continue;

                if (picks[gameId] === results[gameId]) {
                    let points = 1;
                    if (gameId === 'superbowl') {
                        points = pointValues['superbowl'];
                    } else if (gameId.startsWith('wc_')) {
                        points = pointValues['wc_'];
                    } else if (gameId.startsWith('div_')) {
                        points = pointValues['div_'];
                    } else if (gameId.startsWith('conf_')) {
                        points = pointValues['conf_'];
                    }

                    score += points;
                    correct.push(gameId);
                } else if (picks[gameId]) {
                    incorrect.push(gameId);
                }
            }

            return { score, correct, incorrect };
        }

        // ===== LEADERBOARD =====

        function updateLeaderboard() {
            const container = document.getElementById('leaderboard-container');

            if (brackets.length === 0) {
                container.innerHTML = '<div class="empty-state">No brackets submitted yet. Be the first!</div>';
                return;
            }

            // Calculate scores for all brackets
            const scored = brackets.map(bracket => {
                const { score, correct, incorrect } = calculateScore(bracket.picks);
                const sbDiff = results.sbActualTotal ? Math.abs((bracket.sbTotalPoints || 0) - results.sbActualTotal) : 999;
                return { ...bracket, score, correct, incorrect, sbDiff };
            });

            // Sort by score descending, then by tiebreaker (closer to actual is better)
            scored.sort((a, b) => {
                if (b.score !== a.score) {
                    return b.score - a.score;
                }
                return a.sbDiff - b.sbDiff;
            });

            // Generate table
            let html = `
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Name</th>
                            <th>Score</th>
                            <th>Bracket</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            scored.forEach((bracket, index) => {
                const rank = index + 1;
                const rowClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';

                html += `
                    <tr class="${rowClass}">
                        <td>${rank}</td>
                        <td>${escapeHtml(bracket.name)}</td>
                        <td>${bracket.score} points</td>
                        <td><button onclick="viewBracketPicks('${escapeHtml(bracket.name).replace(/'/g, "\\'")}', ${index})" class="bracket-link" style="background: none; border: none; color: #0066cc; cursor: pointer; text-decoration: underline; font-size: 14px;">View Picks</button></td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function viewBracketPicks(name, index) {
            const scored = brackets.map(bracket => {
                const { score, correct, incorrect } = calculateScore(bracket.picks);
                const sbDiff = results.sbActualTotal ? Math.abs((bracket.sbTotalPoints || 0) - results.sbActualTotal) : 999;
                return { ...bracket, score, correct, incorrect, sbDiff };
            });
            scored.sort((a, b) => {
                if (b.score !== a.score) {
                    return b.score - a.score;
                }
                return a.sbDiff - b.sbDiff;
            });

            const bracket = scored[index];
            if (!bracket) {
                alert('Bracket not found');
                return;
            }

            const picks = bracket.picks;

            const isCorrect = (gameId) => {
                if (!results[gameId]) return '';
                return bracket.correct.includes(gameId) ? ' [Correct]' : ' [Wrong]';
            };

            let message = `${name}'s Picks\n`;
            message += `Score: ${bracket.score} points\n\n`;

            message += '=== WILDCARD ROUND ===\n';
            if (picks.wc_afc_1) message += `AFC Game 1: ${getTeamDisplay(picks.wc_afc_1)}${isCorrect('wc_afc_1')}\n`;
            if (picks.wc_afc_2) message += `AFC Game 2: ${getTeamDisplay(picks.wc_afc_2)}${isCorrect('wc_afc_2')}\n`;
            if (picks.wc_afc_3) message += `AFC Game 3: ${getTeamDisplay(picks.wc_afc_3)}${isCorrect('wc_afc_3')}\n`;
            if (picks.wc_nfc_1) message += `NFC Game 1: ${getTeamDisplay(picks.wc_nfc_1)}${isCorrect('wc_nfc_1')}\n`;
            if (picks.wc_nfc_2) message += `NFC Game 2: ${getTeamDisplay(picks.wc_nfc_2)}${isCorrect('wc_nfc_2')}\n`;
            if (picks.wc_nfc_3) message += `NFC Game 3: ${getTeamDisplay(picks.wc_nfc_3)}${isCorrect('wc_nfc_3')}\n`;

            message += '\n=== DIVISIONAL ROUND ===\n';
            if (picks.div_afc_1) message += `AFC Game 1: ${getTeamDisplay(picks.div_afc_1)}${isCorrect('div_afc_1')}\n`;
            if (picks.div_afc_2) message += `AFC Game 2: ${getTeamDisplay(picks.div_afc_2)}${isCorrect('div_afc_2')}\n`;
            if (picks.div_nfc_1) message += `NFC Game 1: ${getTeamDisplay(picks.div_nfc_1)}${isCorrect('div_nfc_1')}\n`;
            if (picks.div_nfc_2) message += `NFC Game 2: ${getTeamDisplay(picks.div_nfc_2)}${isCorrect('div_nfc_2')}\n`;

            message += '\n=== CONFERENCE CHAMPIONSHIPS ===\n';
            if (picks.conf_afc) message += `AFC: ${getTeamDisplay(picks.conf_afc)}${isCorrect('conf_afc')}\n`;
            if (picks.conf_nfc) message += `NFC: ${getTeamDisplay(picks.conf_nfc)}${isCorrect('conf_nfc')}\n`;

            message += '\n=== SUPER BOWL ===\n';
            if (picks.superbowl) message += `Winner: ${getTeamDisplay(picks.superbowl)}${isCorrect('superbowl')}\n`;

            message += '\n=== TIEBREAKER ===\n';
            message += `Super Bowl Total Points: ${bracket.sbTotalPoints || 'Not entered'}\n`;
            if (results.sbActualTotal) {
                const diff = Math.abs((bracket.sbTotalPoints || 0) - results.sbActualTotal);
                message += `Actual Total: ${results.sbActualTotal} (off by ${diff})\n`;
            }

            alert(message);
        }

        // ===== UTILITY =====

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== INITIALIZATION =====

        async function init() {
            await loadConfig();
            await loadData();
        }

        init();

        // Auto-refresh data every 30 seconds
        setInterval(() => {
            loadData();
        }, 30000);
    </script>
</body>
</html>
